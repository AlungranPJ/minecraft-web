<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>voxel engine demo - first person player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9ec9ef;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#game {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        white-space: pre;
        color: #f2f7ff;
        background: rgba(12, 18, 28, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        text-align: center;
        color: #f6faff;
        background: rgba(12, 18, 28, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        pointer-events: none;
      }
      #help {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 10px;
        color: #eaf2ff;
        background: rgba(12, 18, 28, 0.45);
        border-radius: 6px;
        pointer-events: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
      }
      #crosshair::before {
        left: 6px;
        top: 0;
        width: 2px;
        height: 14px;
      }
      #crosshair::after {
        top: 6px;
        left: 0;
        height: 2px;
        width: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="crosshair"></div>
      <div id="hud">booting…</div>
      <div id="hint">click to play</div>
      <div id="help"></div>
    </div>
    <script type="module" src="/src/player-demo.ts"></script>
  </body>
</html>
