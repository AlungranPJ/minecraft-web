<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>voxel dig / place / hotbar demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9ec9ef;
        color: #f2f7ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#game {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1420;
        z-index: 30;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: 42%;
        transform: translateX(-50%);
        padding: 8px 14px;
        background: rgba(10, 14, 22, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        pointer-events: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hint">คลิกเพื่อเริ่มเล่น (mouse look) — HUD ด้านล่างคือ hotbar</div>
    </div>
    <div id="boot">booting…</div>
    <script type="module" src="/src/interactionDemo.ts"></script>
  </body>
</html>
